<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IGNITE FIT - Personalização</title>

  <style>

    /* ============================= */
    /* RESET */
    /* ============================= */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }


    /* ============================= */
    /* BODY */
    /* ============================= */

    body{
      width:100%;
      min-height:100vh;

      background:
      radial-gradient(
        circle at top,
        #1e3a8a 0%,
        #0f172a 45%,
        #020617 100%
      );

      color:white;

      padding-top:52px;

      overflow:hidden;
    }


    /* ============================= */
    /* EFEITOS DO FUNDO */
    /* ============================= */

    body::before{
      content:"";

      position:fixed;

      width:700px;
      height:700px;

      background:#2563eb;

      filter:blur(180px);

      opacity:0.18;

      top:-250px;
      left:-250px;

      pointer-events:none;
    }


    body::after{
      content:"";

      position:fixed;

      width:600px;
      height:600px;

      background:#06b6d4;

      filter:blur(180px);

      opacity:0.15;

      bottom:-250px;
      right:-250px;

      pointer-events:none;
    }


    /* ============================= */
    /* NAVBAR */
    /* ============================= */

    .navbar{

      width:100%;
      height:52px;

      position:fixed;

      top:0;
      left:0;

      z-index:1000;

      display:flex;

      align-items:center;

      padding:0 63px;

      background:#020914;

      border-bottom:
      2px solid #2196f3;

      box-shadow:
      0 2px 15px rgba(0,0,0,0.35);
    }


    /* LOGO */

    .logo{

      font-size:20px;

      font-weight:bold;

      color:white;

      text-decoration:none;

      margin-right:30px;

      letter-spacing:-0.5px;

    }


    .logo span{

      color:#38a5ff;

    }


    /* MENU */

    .menu{

      display:flex;

      align-items:center;

      gap:25px;

      height:100%;

    }


    .menu a{

      color:white;

      text-decoration:none;

      font-size:16px;

      font-weight:bold;

      transition:0.3s;

      position:relative;

      white-space:nowrap;

    }


    .menu a:hover{

      color:#2196f3;

    }


    .menu a::after{

      content:"";

      position:absolute;

      left:0;

      bottom:-7px;

      width:0;

      height:2px;

      background:#2196f3;

      transition:0.3s;

    }


    .menu a:hover::after{

      width:100%;

    }


    /* ============================= */
    /* CONTAINER PRINCIPAL */
    /* ============================= */

    .container{

      width:1350px;

      max-width:calc(100% - 60px);

      height:calc(100vh - 82px);

      min-height:650px;

      margin:15px auto;

      background:
      rgba(15,23,42,0.88);

      border:
      1px solid rgba(255,255,255,0.08);

      backdrop-filter:blur(18px);

      border-radius:30px;

      overflow:hidden;

      display:flex;

      position:relative;

      z-index:10;

      box-shadow:
      0 0 30px rgba(37,99,235,0.25),
      0 0 90px rgba(0,0,0,0.6);
    }


    /* ============================= */
    /* PERSONAGEM */
    /* ============================= */

    .personagem{

      flex:1;

      display:flex;

      justify-content:center;

      align-items:center;

      position:relative;

      background:
      linear-gradient(
        180deg,
        #111827 0%,
        #0f172a 100%
      );

      overflow:hidden;

    }


    .personagem::before{

      content:"";

      position:absolute;

      width:500px;
      height:500px;

      background:#2563eb;

      border-radius:50%;

      filter:blur(140px);

      opacity:0.22;

    }


    /* ============================= */
    /* MODELO */
    /* ============================= */

    .modelo{

      position:relative;

      width:90%;
      height:90%;

      display:flex;

      justify-content:center;

      align-items:center;

      z-index:2;

    }


    .modelo img{

      width:100%;
      height:100%;

      object-fit:contain;

      border-radius:20px;

      filter:
      drop-shadow(
        0 25px 35px rgba(0,0,0,0.65)
      );

      transition:0.4s;

    }


    .modelo img:hover{

      transform:scale(1.02);

    }


    /* ============================= */
    /* PAINEL */
    /* ============================= */

    .painel{

      width:470px;

      background:
      rgba(17,24,39,0.97);

      border-left:
      1px solid rgba(255,255,255,0.06);

      padding:28px;

      overflow-y:auto;

      display:flex;

      flex-direction:column;

      gap:20px;

    }


    /* SCROLLBAR */

    .painel::-webkit-scrollbar{

      width:8px;

    }


    .painel::-webkit-scrollbar-track{

      background:#020617;

    }


    .painel::-webkit-scrollbar-thumb{

      background:#334155;

      border-radius:10px;

    }


    .painel::-webkit-scrollbar-thumb:hover{

      background:#2563eb;

    }


    /* ============================= */
    /* TITULO */
    /* ============================= */

    .titulo-painel{

      width:100%;

      padding:22px;

      border-radius:20px;

      text-align:center;

      font-size:25px;

      font-weight:bold;

      letter-spacing:2px;

      color:white;

      background:
      linear-gradient(
        135deg,
        rgba(37,99,235,0.25),
        rgba(6,182,212,0.15)
      );

      border:
      1px solid rgba(255,255,255,0.08);

      box-shadow:
      0 0 25px rgba(37,99,235,0.18);

    }


    /* ============================= */
    /* CARD */
    /* ============================= */

    .card{

      background:
      rgba(30,41,59,0.7);

      border:
      1px solid rgba(255,255,255,0.06);

      border-radius:22px;

      padding:22px;

    }


    .card h2{

      color:white;

      margin-bottom:18px;

      font-size:20px;

    }


    /* ============================= */
    /* CAMPOS */
    /* ============================= */

    .campo{

      margin-bottom:20px;

    }


    .campo:last-child{

      margin-bottom:0;

    }


    .campo label{

      display:block;

      margin-bottom:10px;

      color:#cbd5e1;

      font-size:14px;

      font-weight:bold;

    }


    select{

      width:100%;

      padding:15px;

      border:none;

      outline:none;

      border-radius:14px;

      background:#020617;

      color:white;

      font-size:15px;

      border:
      1px solid rgba(255,255,255,0.08);

      cursor:pointer;

    }


    select:focus{

      border-color:#2563eb;

      box-shadow:
      0 0 15px rgba(37,99,235,0.25);

    }


    /* ============================= */
    /* COLOR PICKER */
    /* ============================= */

    input[type="color"]{

      width:100%;

      height:70px;

      border:none;

      background:none;

      cursor:pointer;

    }


    /* ============================= */
    /* BOTÃO */
    /* ============================= */

    .botao{

      width:100%;

      padding:18px;

      border:none;

      border-radius:18px;

      background:
      linear-gradient(
        135deg,
        #2563eb,
        #06b6d4
      );

      color:white;

      font-size:17px;

      font-weight:bold;

      cursor:pointer;

      transition:0.3s;

    }


    .botao:hover{

      transform:scale(1.03);

      box-shadow:
      0 0 30px rgba(6,182,212,0.45);

    }


    .botao:active{

      transform:scale(0.98);

    }


    /* ============================= */
    /* RESPONSIVO */
    /* ============================= */

    @media(max-width:1100px){

      body{

        overflow:auto;

      }


      .navbar{

        padding:0 25px;

      }


      .container{

        flex-direction:column;

        height:auto;

        max-width:calc(100% - 30px);

        margin:15px auto;

      }


      .painel{

        width:100%;

      }


      .personagem{

        min-height:600px;

      }

    }


    @media(max-width:650px){

      .navbar{

        height:auto;

        min-height:60px;

        padding:12px 20px;

        flex-wrap:wrap;

        gap:10px;

      }


      body{

        padding-top:70px;

      }


      .logo{

        margin-right:10px;

      }


      .menu{

        gap:15px;

        flex-wrap:wrap;

      }


      .menu a{

        font-size:14px;

      }


      .container{

        max-width:calc(100% - 20px);

        border-radius:20px;

      }


      .personagem{

        min-height:450px;

      }


      .painel{

        padding:18px;

      }

    }

  </style>

</head>


<body>


  <!-- ================================= -->
  <!-- NAVBAR -->
  <!-- ================================= -->

  <nav class="navbar">

    <a href="index.html" class="logo">
      ignite<span>FIT</span>
    </a>


    <div class="menu">

      <a href="index.html">
        Home
      </a>

      <a href="produtos.html">
        Produtos
      </a>

      <a href="contato.html">
        Contato
      </a>

      <a href="cadastro.html">
        Cadastro/Login
      </a>

    </div>

  </nav>



  <!-- ================================= -->
  <!-- CONTAINER PRINCIPAL -->
  <!-- ================================= -->

  <div class="container">


    <!-- =============================== -->
    <!-- PERSONAGEM -->
    <!-- =============================== -->

    <div class="personagem">

      <div class="modelo">

        <img
          id="modeloImagem"
          src="img/top-modelo.png"
          alt="Modelo Fitness"
        >

      </div>

    </div>



    <!-- =============================== -->
    <!-- PAINEL -->
    <!-- =============================== -->

    <div class="painel">


      <div class="titulo-painel">

        PERSONALIZAÇÃO

      </div>



      <!-- =============================== -->
      <!-- PARTE SUPERIOR -->
      <!-- =============================== -->

      <div class="card">

        <h2>
          Parte Superior
        </h2>


        <div class="campo">

          <label>
            Modelo
          </label>


          <select id="modeloTopo">


            <option value="img/top-modelo.png">
              Top Fitness
            </option>


            <option value="img/camiseta-modelo.png">
              Camiseta Dry Fit
            </option>


            <option value="img/jaqueta-modelo.png">
              Jaqueta Esportiva
            </option>


            <option value="img/regata-modelo.png">
              Regata Fitness
            </option>


            <option value="img/cropped-modelo.png">
              Cropped Esportivo
            </option>


            <option value="img/blusa-modelo.png">
              Blusa Fitness
            </option>


            <option value="img/moletom-modelo.png">
              Moletom Esportivo
            </option>


          </select>

        </div>



        <div class="campo">

          <label>
            Cor
          </label>


          <input
            type="color"
            id="corTopo"
            value="#2563eb"
          >

        </div>

      </div>



      <!-- =============================== -->
      <!-- PARTE INFERIOR -->
      <!-- =============================== -->

      <div class="card">

        <h2>
          Parte Inferior
        </h2>


        <div class="campo">

          <label>
            Modelo
          </label>


          <select id="modeloInferior">


            <option value="img/legging-modelo.png">
              Legging
            </option>


            <option value="img/short-modelo.png">
              Short Fitness
            </option>


            <option value="img/jogger-modelo.png">
              Calça Jogger
            </option>


            <option value="img/short-saia-modelo.png">
              Short Saia
            </option>


            <option value="img/calca-fitness-modelo.png">
              Calça Fitness
            </option>


            <option value="img/bermuda-modelo.png">
              Bermuda Esportiva
            </option>


            <option value="img/calca-compressao-modelo.png">
              Calça de Compressão
            </option>


          </select>

        </div>



        <div class="campo">

          <label>
            Cor
          </label>


          <input
            type="color"
            id="corInferior"
            value="#0f172a"
          >

        </div>

      </div>



      <!-- =============================== -->
      <!-- BOTÃO -->
      <!-- =============================== -->

      <button
        class="botao"
        id="confirmar"
      >

        CONFIRMAR PERSONALIZAÇÃO

      </button>


    </div>

  </div>



  <!-- ================================= -->
  <!-- JAVASCRIPT -->
  <!-- ================================= -->

  <script>


    /* =============================== */
    /* ELEMENTOS */
    /* =============================== */

    const modeloImagem =
      document.getElementById("modeloImagem");


    const modeloTopo =
      document.getElementById("modeloTopo");


    const modeloInferior =
      document.getElementById("modeloInferior");


    const corTopo =
      document.getElementById("corTopo");


    const corInferior =
      document.getElementById("corInferior");


    const confirmar =
      document.getElementById("confirmar");



    /* =============================== */
    /* TROCAR MODELO SUPERIOR */
    /* =============================== */

    modeloTopo.addEventListener(
      "change",
      function(){

        modeloImagem.src =
          this.value;

      }
    );



    /* =============================== */
    /* TROCAR MODELO INFERIOR */
    /* =============================== */

    modeloInferior.addEventListener(
      "change",
      function(){

        modeloImagem.src =
          this.value;

      }
    );



    /* =============================== */
    /* COR SUPERIOR */
    /* =============================== */

    corTopo.addEventListener(
      "input",
      function(){

        modeloImagem.style.filter =
        `
        drop-shadow(
          0 25px 35px rgba(0,0,0,0.65)
        )
        `;

      }
    );



    /* =============================== */
    /* COR INFERIOR */
    /* =============================== */

    corInferior.addEventListener(
      "input",
      function(){

        modeloImagem.style.filter =
        `
        drop-shadow(
          0 25px 35px rgba(0,0,0,0.65)
        )
        `;

      }
    );



    /* =============================== */
    /* CONFIRMAR */
    /* =============================== */

    confirmar.addEventListener(
      "click",
      function(){

        alert(
          "Personalização confirmada!"
        );

      }
    );


  </script>


</body>

</html>
